app = "bill-strength-coach"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "coach_data"
  destination = "/data"
  snapshot_retention = 14

[env]
  SQLITE_PATH = "/data/coach.sqlite"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
